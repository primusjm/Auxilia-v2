features:
  title: A list that knows
  titleEmphasis: what it costs
  intro: Most lists remember what you need. Acquisti also remembers what it costs, and where.
  items:
  - title: Planned total
    body: Add a price and quantity to each item and see your planned total before you leave the house.
    image: 01-planned-total
    chipLabel: Total
    chipValue: Ksh 299
    caption: Edit item
  - title: In cart
    body: Tick items off as they go into your cart and watch the total update with every tap. A ring around the + button fills as the cart does.
    image: 02-in-cart
    chipLabel: In cart
    chipValue: Ksh 1,947
    caption: In Cart
  - title: Next Time
    body: Not buying something this trip? Swipe it into Next Time. It stays on your list, and the things you buy most sit at the top as Frequently bought.
    image: 03-next-time
    chipLabel: Next trip
    chipValue: 49 items
    caption: Next Time
  - title: Lists
    body: Keep separate lists for home, the weekend or the office. Each has its own items and shop, and can be shared through iCloud.
    image: 10-lists
    chipLabel: Your lists
    chipValue: 3 lists
    caption: Your lists
  - title: Scan a till slip
    body: Photograph it or pick a photo. The phone reads it on the device, you check the lines, and the prices go to that shop. The photo is never saved.
    image: 08-scan-till-slip
    chipLabel: Till slip
    chipValue: Read on your phone
    caption: Scan receipt
  - title: Trip receipts
    body: Finish shopping and the trip is saved as a receipt, grouped by aisle with the total. Anything you did not find stays on for next time.
    image: 09-trip-receipt
    chipLabel: Spent
    chipValue: Ksh 1,947
    caption: Trip receipt
